<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Merge: __TITLE__</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font:13px/1.5 'Segoe UI',system-ui,sans-serif;background:#1e1e1e;color:#d4d4d4;overflow:hidden;height:100vh}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:8px 16px;background:#2d2d2d;border-bottom:1px solid #444}
.toolbar h1{font-size:15px;font-weight:600;max-width:42vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toolbar .info{font-size:12px;color:#aaa;flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{padding:6px 14px;border:none;border-radius:4px;cursor:pointer;font-size:13px}
.btn-primary{background:#0e639c;color:#fff;font-weight:600}
.btn-primary:hover{background:#1177bb}
.btn-secondary{background:#555;color:#ccc;margin-right:8px}
.btn-secondary:hover{background:#666}
.btn-danger{background:#6f3333;color:#f4cccc;margin-right:8px}
.btn-danger:hover{background:#854040}
.main{display:flex;height:calc(100vh - 45px)}
.panel{flex:1;display:flex;flex-direction:column;min-width:0}
.panel-center{flex:1.4;border-left:2px solid #444;border-right:2px solid #444}
.panel-title{font-size:12px;font-weight:600;padding:6px 12px;background:#2d2d2d;border-bottom:1px solid #333;flex-shrink:0;display:flex;justify-content:space-between;align-items:center;gap:8px}
.panel-title .label-orig{color:#f48771}
.panel-title .label-conf{color:#4ec9b0}
.panel-title .label-merge{color:#569cd6}
.path{font-size:10px;color:#777;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:400}
.panel-body{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:28px}
.row{display:flex;min-height:26px;align-items:stretch;border-bottom:1px solid rgba(255,255,255,0.03)}
.row-removed{background:rgba(244,135,113,0.12)}
.row-added{background:rgba(78,201,176,0.12)}
.gutter{width:42px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:12px;color:#555;user-select:none}
.content{flex:1;white-space:pre;overflow:hidden;text-overflow:ellipsis;font-family:Consolas,monospace;font-size:13px;line-height:26px;padding:0 8px}
.gutter-btn{cursor:pointer;border-radius:3px;font-size:11px;border:none;color:#fff;padding:1px 5px;margin:1px;opacity:0.75}
.gutter-btn:hover{opacity:1}
.btn-accept-left{background:rgba(244,135,113,0.75)}
.btn-accept-right{background:rgba(78,201,176,0.75)}
.accept-all{font-size:10px;padding:2px 6px;border:1px solid #555;border-radius:3px;background:transparent;color:#888;cursor:pointer}
.accept-all:hover{color:#fff;border-color:#888}
.center-row{display:flex;min-height:26px;align-items:stretch;border-bottom:1px solid rgba(255,255,255,0.03)}
.center-row.conflict-row{background:rgba(86,156,214,0.08)}
.center-row.active{outline:1px solid rgba(86,156,214,0.6);outline-offset:-1px}
.center-input{flex:1;white-space:pre;overflow:hidden;font-family:Consolas,monospace;font-size:13px;line-height:26px;padding:0 8px;background:transparent;color:#d4d4d4;border:none;outline:none;resize:none}
.center-input:focus{background:rgba(86,156,214,0.06)}
.status-bar{padding:4px 16px;background:#007acc;color:#fff;font-size:12px;text-align:center;position:fixed;bottom:0;left:0;right:0;z-index:10;display:none}
.empty{display:flex;align-items:center;justify-content:center;height:100vh;color:#4ec9b0;font-size:18px;flex-direction:column;gap:8px;text-align:center}
.empty small{color:#999;font-size:12px}
</style>
</head>
<body>
<div class="toolbar">
  <h1 id="title">Merge Conflicts</h1>
  <span class="info" id="status">Loading...</span>
  <div>
    <button class="btn btn-secondary" id="btnSkip">Skip</button>
    <button class="btn btn-danger" id="btnQuit">Quit</button>
    <button class="btn btn-primary" id="btnSave">Save &amp; Next</button>
  </div>
</div>
<div class="main" id="main">
  <div class="panel panel-left">
    <div class="panel-title">
      <span class="label-orig">Original</span>
      <button class="accept-all" id="btnAcceptAllLeft">All</button>
    </div>
    <div class="path" id="origPath" style="padding:4px 12px;background:#252525"></div>
    <div class="panel-body" id="leftBody"></div>
  </div>
  <div class="panel panel-center">
    <div class="panel-title"><span class="label-merge">Merged Result</span><span style="color:#888;font-size:10px">editable · Ctrl/Cmd+Enter Save & Next · F7 next diff</span></div>
    <div class="panel-body" id="centerBody"></div>
  </div>
  <div class="panel panel-right">
    <div class="panel-title">
      <span class="label-conf">Conflict</span>
      <button class="accept-all" id="btnAcceptAllRight">All</button>
    </div>
    <div class="path" id="confPath" style="padding:4px 12px;background:#252525"></div>
    <div class="panel-body" id="rightBody"></div>
  </div>
</div>
<div class="status-bar" id="statusBar"></div>
<script>
var BLOCKS = [];
var choices = [];
var centerEdits = [];
var currentItem = null;
var activeBlock = null;

loadState();

function esc(s) {
  return (s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function showToast(text) {
  var bar = document.getElementById("statusBar");
  bar.textContent = text;
  bar.style.display = "block";
  setTimeout(function(){ bar.style.display = "none"; }, 1800);
}

function resetForItem(item) {
  currentItem = item;
  BLOCKS = item.blocks || [];
  choices = new Array(BLOCKS.length).fill(null);
  centerEdits = [];
  activeBlock = null;
  for (var i = 0; i < BLOCKS.length; i++) {
    if (BLOCKS[i].type === "removed") choices[i] = "left";
    else if (BLOCKS[i].type === "added") choices[i] = "right";
  }
}

function loadState() {
  fetch("/state")
    .then(function(resp) { return resp.json(); })
    .then(function(state) { applyState(state); })
    .catch(function(e) { showFinished("Cannot load merge session: " + e.message, false); });
}

function applyState(state) {
  if (state.done) {
    showFinished(state.message || "All conflicts processed.", state.result && state.result.success !== false, state.result);
    return;
  }
  resetForItem(state.item);
  render();
}

function showFinished(message, ok, result) {
  var resolved = result ? result.resolved : 0;
  var skipped = result ? result.skipped : 0;
  document.body.innerHTML = '<div class="empty" style="color:' + (ok ? '#4ec9b0' : '#f48771') + '">' +
    '<div>' + esc(ok ? '✓ ' + message : '✗ ' + message) + '</div>' +
    '<small>Resolved ' + resolved + ', skipped ' + skipped + '. You can close this tab.</small>' +
    '</div>';
}

function render() {
  var leftBody = document.getElementById("leftBody");
  var rightBody = document.getElementById("rightBody");
  var centerBody = document.getElementById("centerBody");
  leftBody.innerHTML = "";
  rightBody.innerHTML = "";
  centerBody.innerHTML = "";

  document.getElementById("title").textContent = currentItem.originalName;
  document.getElementById("origPath").textContent = currentItem.originalPath;
  document.getElementById("confPath").textContent = currentItem.conflictPath;
  document.getElementById("btnSave").textContent = currentItem.index === currentItem.total ? "Save & Finish" : "Save & Next";

  var origLine = 1, confLine = 1;
  var resolved = 0, total = 0;

  for (var bi = 0; bi < BLOCKS.length; bi++) {
    var b = BLOCKS[bi];
    var choice = choices[bi];
    if (b.type !== "equal") total++;
    if (b.type !== "equal" && choice != null) resolved++;

    if (b.type === "equal") {
      for (var li = 0; li < b.lines.length; li++) {
        var line = b.lines[li];
        addRow(leftBody, "", origLine++, line);
        addCenterRow(centerBody, bi, li, editedOrDefault(bi, li, line), false);
        addRow(rightBody, "", confLine++, line);
      }
    } else if (b.type === "removed") {
      var nextAdded = BLOCKS[bi + 1] && BLOCKS[bi + 1].type === "added";
      var rightBlock = nextAdded ? BLOCKS[bi + 1] : null;
      var maxLen = Math.max(b.lines.length, rightBlock ? rightBlock.lines.length : 0);

      for (var li = 0; li < maxLen; li++) {
        var origText = b.lines[li] || "";
        var confText = rightBlock ? (rightBlock.lines[li] || "") : "";
        addRow(leftBody, b.lines[li] != null ? "removed" : "", origLine, origText);
        if (b.lines[li] != null) origLine++;

        var mergedLine = "";
        if (choice === "left" && b.lines[li] != null) mergedLine = b.lines[li];
        else if (choice === "right" && confText) mergedLine = confText;
        else if (choice == null && b.lines[li] != null) mergedLine = b.lines[li];
        addCenterRow(centerBody, bi, li, editedOrDefault(bi, li, mergedLine), li === 0);

        addRow(rightBody, confText ? "added" : "", confLine, confText);
        if (confText) confLine++;
      }
      if (nextAdded) bi++;
    } else if (b.type === "added") {
      for (var li = 0; li < b.lines.length; li++) {
        addRow(leftBody, "", 0, "");
        var mergedLine = (choice === "right") ? b.lines[li] : "";
        addCenterRow(centerBody, bi, li, editedOrDefault(bi, li, mergedLine), li === 0);
        addRow(rightBody, "added", confLine++, b.lines[li]);
      }
    }
  }

  document.getElementById("status").textContent = currentItem.index + "/" + currentItem.total + " · " + currentItem.deviceId + " · " + resolved + "/" + total + " blocks resolved";
}

function editedOrDefault(blockIdx, lineIdx, fallback) {
  return centerEdits[blockIdx] && centerEdits[blockIdx][lineIdx] !== undefined
    ? centerEdits[blockIdx][lineIdx]
    : fallback;
}

function addRow(container, cls, num, text) {
  var div = document.createElement("div");
  div.className = "row" + (cls ? " row-" + cls : "");
  div.innerHTML = '<div class="gutter">' + (num || "") + '</div><div class="content">' + esc(text) + '</div>';
  container.appendChild(div);
}

function addCenterRow(container, blockIdx, lineIdx, text, showBtns) {
  var div = document.createElement("div");
  div.className = "center-row";
  if (BLOCKS[blockIdx] && BLOCKS[blockIdx].type !== "equal") div.className += " conflict-row";
  if (activeBlock === blockIdx) div.className += " active";

  var gutter = "";
  if (showBtns && BLOCKS[blockIdx] && BLOCKS[blockIdx].type !== "equal") {
    gutter = '<button class="gutter-btn btn-accept-left" data-action="accept" data-block="' + blockIdx + '" data-side="left">\u00AB</button>' +
             '<button class="gutter-btn btn-accept-right" data-action="accept" data-block="' + blockIdx + '" data-side="right">\u00BB</button>';
  }
  div.innerHTML = '<div class="gutter">' + gutter + '</div>' +
    '<textarea class="center-input" data-block="' + blockIdx + '" data-line="' + lineIdx + '" rows="1">' + esc(text) + '</textarea>';
  container.appendChild(div);
}

document.addEventListener("click", function(e) {
  var btn = e.target.closest("[data-action]");
  if (!btn) return;
  if (btn.dataset.action === "accept") {
    choices[parseInt(btn.dataset.block, 10)] = btn.dataset.side;
    activeBlock = parseInt(btn.dataset.block, 10);
    render();
  }
});

document.getElementById("btnAcceptAllLeft").addEventListener("click", function() {
  for (var i = 0; i < BLOCKS.length; i++) if (BLOCKS[i].type !== "equal") choices[i] = "left";
  render();
});

document.getElementById("btnAcceptAllRight").addEventListener("click", function() {
  for (var i = 0; i < BLOCKS.length; i++) if (BLOCKS[i].type !== "equal") choices[i] = "right";
  render();
});

document.addEventListener("focusin", function(e) {
  if (e.target.classList.contains("center-input")) activeBlock = parseInt(e.target.dataset.block, 10);
});

document.addEventListener("input", function(e) {
  if (e.target.classList.contains("center-input")) {
    var bi = parseInt(e.target.dataset.block, 10);
    var li = parseInt(e.target.dataset.line, 10);
    if (!centerEdits[bi]) centerEdits[bi] = {};
    centerEdits[bi][li] = e.target.value;
    e.target.style.height = "auto";
    e.target.style.height = e.target.scrollHeight + "px";
  }
});

function buildMergedResult() {
  var result = [];
  for (var bi = 0; bi < BLOCKS.length; bi++) {
    var b = BLOCKS[bi];
    var choice = choices[bi];

    if (b.type === "equal") {
      for (var li = 0; li < b.lines.length; li++) result.push((centerEdits[bi] && centerEdits[bi][li]) || b.lines[li]);
    } else if (b.type === "removed") {
      var hasRight = BLOCKS[bi + 1] && BLOCKS[bi + 1].type === "added";
      var rightBlock = hasRight ? BLOCKS[bi + 1] : null;
      var maxLen = Math.max(b.lines.length, rightBlock ? rightBlock.lines.length : 0);
      for (var li = 0; li < maxLen; li++) {
        var mergedLine = "";
        if (centerEdits[bi] && centerEdits[bi][li] !== undefined) mergedLine = centerEdits[bi][li] || "";
        else if (choice === "left") mergedLine = b.lines[li] || "";
        else if (choice === "right") mergedLine = (rightBlock && rightBlock.lines[li]) || "";
        else mergedLine = b.lines[li] || (rightBlock && rightBlock.lines[li]) || "";
        result.push(mergedLine);
      }
      if (hasRight) bi++;
    } else if (b.type === "added") {
      if (choice === "right") {
        for (var li = 0; li < b.lines.length; li++) result.push((centerEdits[bi] && centerEdits[bi][li]) || b.lines[li]);
      }
    }
  }
  return result.join("\n");
}

function postAndApply(url, body) {
  fetch(url, { method: "POST", headers: {"Content-Type": "text/plain"}, body: body || "" })
    .then(function(resp) { return resp.json(); })
    .then(function(state) {
      if (state.action && state.action.success === false) showToast("Action failed: " + state.action.error);
      applyState(state);
    })
    .catch(function(e) { alert("Request failed: " + e.message); });
}

document.getElementById("btnSave").addEventListener("click", function() { postAndApply("/save", buildMergedResult()); });
document.getElementById("btnSkip").addEventListener("click", function() { postAndApply("/skip"); });
document.getElementById("btnQuit").addEventListener("click", function() { postAndApply("/quit"); });

document.addEventListener("keydown", function(e) {
  if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
    e.preventDefault();
    postAndApply("/save", buildMergedResult());
  } else if (e.altKey && e.key === "ArrowLeft") {
    e.preventDefault();
    acceptActive("left");
  } else if (e.altKey && e.key === "ArrowRight") {
    e.preventDefault();
    acceptActive("right");
  } else if (e.key === "F7") {
    e.preventDefault();
    focusNextConflict();
  }
});

function acceptActive(side) {
  var target = activeBlock;
  if (target == null || !BLOCKS[target] || BLOCKS[target].type === "equal") target = firstConflictBlock();
  if (target != null) {
    choices[target] = side;
    activeBlock = target;
    render();
    focusBlock(target);
  }
}

function firstConflictBlock() {
  for (var i = 0; i < BLOCKS.length; i++) if (BLOCKS[i].type !== "equal") return i;
  return null;
}

function focusNextConflict() {
  var start = activeBlock == null ? -1 : activeBlock;
  for (var i = start + 1; i < BLOCKS.length; i++) {
    if (BLOCKS[i].type !== "equal") { activeBlock = i; render(); focusBlock(i); return; }
  }
  for (var j = 0; j <= start; j++) {
    if (BLOCKS[j].type !== "equal") { activeBlock = j; render(); focusBlock(j); return; }
  }
}

function focusBlock(blockIdx) {
  setTimeout(function() {
    var el = document.querySelector('.center-input[data-block="' + blockIdx + '"]');
    if (el) { el.focus(); el.scrollIntoView({block: "center"}); }
  }, 0);
}

["leftBody","centerBody","rightBody"].forEach(function(id) {
  document.getElementById(id).addEventListener("scroll", function() {
    var top = this.scrollTop;
    document.getElementById("leftBody").scrollTop = top;
    document.getElementById("centerBody").scrollTop = top;
    document.getElementById("rightBody").scrollTop = top;
  });
});
</script>
</body>
</html>
