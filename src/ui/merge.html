<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Merge: __TITLE__</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font:13px/1.5 'Segoe UI',system-ui,sans-serif;background:#1e1e1e;color:#d4d4d4;overflow:hidden;height:100vh}
.header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 16px;background:#2d2d2d;border-bottom:1px solid #3c3f41}
.header h1{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:34vw}
.header .info{font-size:12px;color:#9e9e9e;flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.main{display:flex;height:calc(100vh - 45px - 42px)}
.pane{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
.pane-center{flex:1.4;border-left:1px solid #323232;border-right:1px solid #323232}
.pane-title{font-size:12px;font-weight:600;padding:6px 12px;background:#2d2d2d;border-bottom:1px solid #3c3f41;flex-shrink:0;display:flex;justify-content:space-between;align-items:center;gap:8px}
.pane-title .label-left{color:#f48771}
.pane-title .label-center{color:#569cd6}
.pane-title .label-right{color:#4ec9b0}
.pane-file{font-size:10px;color:#757575;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:400}
.pane-body-wrap{flex:1;position:relative;min-height:0}
.pane-body{height:100%;overflow-y:auto;overflow-x:hidden}
.row{display:flex;min-height:24px;align-items:stretch}
.row .ln{width:44px;flex-shrink:0;text-align:right;padding-right:8px;color:#5a5a5a;font:12px/24px Consolas,monospace;user-select:none}
.row .code{flex:1;white-space:pre;overflow:hidden;font-family:Consolas,'Courier New',monospace;font-size:13px;line-height:24px;padding:0 8px}
.row-changed-left .code{background:rgba(244,135,113,0.14)}
.row-changed-right .code{background:rgba(78,201,176,0.14)}
.row-ctx{background:rgba(255,255,255,0.015)}
.center-body-wrap{display:flex;height:100%}
#centerBody{flex:1;position:relative}
.strip{width:14px;flex-shrink:0;background:#252525;position:relative;cursor:pointer}
.strip-seg{position:absolute;left:3px;right:3px;background:#4ec9b0;border-radius:2px}
.strip-seg.pending{background:#e5a34c}
.strip-viewport{position:absolute;left:1px;right:1px;background:rgba(255,255,255,0.14);border:1px solid rgba(255,255,255,0.2);border-radius:2px;pointer-events:none}
.crow{display:flex;min-height:24px;align-items:stretch}
.crow-region-left .code{background:rgba(255,255,255,0.03)}
.crow-region-pending .code{background:rgba(229,163,76,0.10)}
.crow-region-right .code{background:rgba(78,201,176,0.10)}
.crow-active{outline:1px solid rgba(86,156,214,0.55);outline-offset:-1px}
.crow .ln{width:44px;flex-shrink:0;display:flex;align-items:center;justify-content:flex-end;padding-right:6px;gap:2px;user-select:none}
.acc-btn{cursor:pointer;border:none;border-radius:3px;font-size:11px;line-height:16px;width:18px;color:#fff;opacity:0.8;padding:0}
.acc-btn:hover{opacity:1}
.acc-left{background:#b56a5a}
.acc-right{background:#4ec9b0}
.crow .code{flex:1;white-space:pre;overflow:hidden;font-family:Consolas,'Courier New',monospace;font-size:13px;line-height:24px;padding:0 8px}
.crow textarea{flex:1;white-space:pre;overflow:hidden;font-family:Consolas,'Courier New',monospace;font-size:13px;line-height:24px;padding:0 8px;background:transparent;color:#d4d4d4;border:none;outline:none;resize:none}
.crow textarea:focus{background:rgba(86,156,214,0.07)}
.footer{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 16px;background:#2d2d2d;border-top:1px solid #3c3f41;height:42px}
.footer .nav{display:flex;align-items:center;gap:6px}
.fbtn{padding:4px 10px;border:1px solid #555;border-radius:4px;background:transparent;color:#ccc;cursor:pointer;font-size:12px}
.fbtn:hover{background:#3d3d3d;color:#fff}
.nav-info{font-size:11px;color:#e5a34c;min-width:90px;text-align:center}
.footer .actions{display:flex;gap:8px}
.abtn{padding:6px 18px;border:none;border-radius:4px;cursor:pointer;font-size:13px;font-weight:600}
.abtn-apply{background:#2d7d46;color:#fff}
.abtn-apply:hover{background:#349553}
.abtn-primary{background:#0e639c;color:#fff}
.abtn-primary:hover{background:#1177bb}
.abtn-secondary{background:#555;color:#ccc}
.abtn-secondary:hover{background:#666}
.status-bar{padding:4px 16px;background:#007acc;color:#fff;font-size:12px;text-align:center;position:fixed;bottom:0;left:0;right:0;z-index:10;display:none}
.finished{display:none;align-items:center;justify-content:center;height:100vh;color:#4ec9b0;font-size:18px;flex-direction:column;gap:8px;text-align:center}
.finished small{color:#999;font-size:12px}
</style>
</head>
<body>
<div class="header">
  <h1 id="title">合并冲突</h1>
  <span class="info" id="status">Loading...</span>
  <div>
    <button class="fbtn" id="btnSkip">跳过 (Skip)</button>
    <button class="fbtn" id="btnQuit">退出 (Quit)</button>
  </div>
</div>
<div class="main">
  <div class="pane">
    <div class="pane-title"><span class="label-left">您的版本 (Original)</span></div>
    <div class="pane-file" id="origPath" style="padding:3px 12px;background:#252525"></div>
    <div class="pane-body-wrap"><div class="pane-body" id="leftBody"></div></div>
  </div>
  <div class="pane pane-center">
    <div class="pane-title"><span class="label-center">合并结果 (Result — 可编辑)</span></div>
    <div class="pane-file" style="padding:3px 12px;background:#252525" id="centerHint">中间栏初始为您的版本；用 » 把右侧更改拉进来，或直接编辑</div>
    <div class="pane-body-wrap">
      <div class="center-body-wrap">
        <div class="pane-body" id="centerBody"></div>
        <div class="strip" id="strip" title="差异概览，点击跳转"><div class="strip-viewport" id="stripViewport"></div></div>
      </div>
    </div>
  </div>
  <div class="pane">
    <div class="pane-title"><span class="label-right">服务器更改 (Conflict)</span></div>
    <div class="pane-file" id="confPath" style="padding:3px 12px;background:#252525"></div>
    <div class="pane-body-wrap"><div class="pane-body" id="rightBody"></div></div>
  </div>
</div>
<div class="footer">
  <div class="nav">
    <button class="fbtn" id="btnPrev">&#8249; Prev (Shift+F7)</button>
    <span class="nav-info" id="navInfo">0/0</span>
    <button class="fbtn" id="btnNext">Next (F7) &#8250;</button>
  </div>
  <div class="actions">
    <button class="abtn abtn-secondary" id="btnAbort">中止 (Skip)</button>
    <button class="abtn abtn-primary" id="btnApply">应用并下一个 (Ctrl+Enter)</button>
  </div>
</div>
<div class="status-bar" id="statusBar"></div>
<div class="finished" id="finished"><div id="finishedMsg"></div><small id="finishedDetail"></small></div>
<script>
var BLOCKS = [];
var regions = [];     // {start,end,origLines[],confLines[],state:'pending'|'left'|'right'}
var currentItem = null;
var activeRegion = -1;
var centerEdits = {}; // key r+':'+i -> user-edited line
var lineCount = 1;

loadState();

function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function showToast(text) {
  var bar = document.getElementById("statusBar");
  bar.textContent = text;
  bar.style.display = "block";
  setTimeout(function(){ bar.style.display = "none"; }, 1600);
}

function loadState() {
  fetch("/state")
    .then(function(r) { return r.json(); })
    .then(function(state) { applyState(state); })
    .catch(function(e) { showFinished("Cannot load merge session: " + e.message, false); });
}

function applyState(state) {
  currentItem = state.item || null;
  if (currentItem) {
    BLOCKS = currentItem.blocks || [];
    regions = [];
    centerEdits = {};
    activeRegion = -1;
    buildRegions();
  }
  render();
  if (state.done) showFinished(state.message || "Session finished", !state.result || state.result.success, state.result);
}

function showFinished(message, ok, result) {
  document.querySelector(".main").style.display = "none";
  document.querySelector(".header").style.display = "none";
  document.querySelector(".footer").style.display = "none";
  var el = document.getElementById("finished");
  el.style.display = "flex";
  document.getElementById("finishedMsg").textContent = message || "Finished";
  document.getElementById("finishedDetail").textContent =
    result && result.resolved != null ? "resolved " + result.resolved + " · skipped " + result.skipped : "";
}

/** 变更区域：removed(+added) 对或独立 added，等价于 IDEA 的一个 change chunk */
function buildRegions() {
  regions = [];
  var i = 0;
  while (i < BLOCKS.length) {
    var b = BLOCKS[i];
    if (b.type === "equal") { i++; continue; }
    var r = { start: i, end: i, origLines: [], confLines: [], state: "pending" };
    if (b.type === "removed") {
      r.origLines = b.lines.slice();
      i++;
      if (BLOCKS[i] && BLOCKS[i].type === "added") { r.confLines = BLOCKS[i].lines.slice(); i++; }
    } else {
      r.confLines = b.lines.slice();
      i++;
    }
    r.end = i - 1;
    regions.push(r);
  }
}

function regionCenterLines(r) {
  // 用户手改的内容优先；未改过的行按区域状态取对应侧
  var left = r.origLines, right = r.confLines.length ? r.confLines : left;
  var src = r.state === "right" ? right : left;
  var lines = [];
  var n = Math.max(src.length, r.state === "right" ? 0 : 0);
  for (var i = 0; i < src.length; i++) {
    var key = regions.indexOf(r) + ":" + i;
    lines.push(centerEdits[key] !== undefined ? centerEdits[key] : src[i]);
  }
  return lines;
}

function render() {
  document.getElementById("title").textContent = currentItem.originalName;
  document.getElementById("origPath").textContent = currentItem.originalPath;
  document.getElementById("confPath").textContent = currentItem.conflictPath;
  var leftBody = document.getElementById("leftBody");
  var centerBody = document.getElementById("centerBody");
  var rightBody = document.getElementById("rightBody");
  leftBody.innerHTML = ""; centerBody.innerHTML = ""; rightBody.innerHTML = "";

  var origLine = 1, confLine = 1;
  var regionIdx = -1;

  function leftRow(cls, text) {
    var d = document.createElement("div");
    d.className = "row " + cls;
    d.innerHTML = '<div class="ln">' + (cls ? "" : origLine++) + '</div><div class="code">' + esc(text) + '</div>';
    leftBody.appendChild(d);
  }
  function rightRow(cls, text) {
    var d = document.createElement("div");
    d.className = "row " + cls;
    d.innerHTML = '<div class="ln">' + (cls ? "" : confLine++) + '</div><div class="code">' + esc(text) + '</div>';
    rightBody.appendChild(d);
  }

  // 中间栏行缓冲：{cls, ln, region, idx, text}
  var crows = [];
  function crow(cls, region, idx, text, showBtns) {
    crows.push({ cls: cls, region: region, idx: idx, text: text, showBtns: showBtns });
  }

  for (var bi = 0; bi < BLOCKS.length; bi++) {
    var b = BLOCKS[bi];
    if (b.type === "equal") {
      regionIdx++;
      for (var li = 0; li < b.lines.length; li++) {
        leftRow("row-ctx", b.lines[li]);
        rightRow("row-ctx", b.lines[li]);
        crow("crow-region-left", regionIdx, li, b.lines[li], false);
      }
    } else {
      regionIdx++;
      var r = regions[regionIdx];
      var isLast = true;
      var addedHere = b.type === "added" ? b : (BLOCKS[bi + 1] && BLOCKS[bi + 1].type === "added" ? BLOCKS[bi + 1] : null);
      var removedHere = b.type === "removed" ? b : null;
      var n = Math.max(removedHere ? removedHere.lines.length : 0, addedHere ? addedHere.lines.length : 0);
      for (var k = 0; k < n; k++) {
        var lTxt = removedHere ? (removedHere.lines[k] || "") : "";
        var rTxt = addedHere ? (addedHere.lines[k] || "") : "";
        if (removedHere && removedHere.lines[k] != null) leftRow("row-changed-left", removedHere.lines[k]);
        else leftRow("row-changed-left", "");
        if (addedHere && addedHere.lines[k] != null) rightRow("row-changed-right", addedHere.lines[k]);
        else rightRow("row-changed-right", "");
        var key = regionIdx + ":" + k;
        var txt = centerEdits[key] !== undefined ? centerEdits[key]
          : (r.state === "right" ? rTxt : lTxt);
        crow("crow-region-" + r.state, regionIdx, k, txt, k === 0);
      }
      if (addedHere) bi++;
    }
  }

  // 渲染中间栏
  for (var ci = 0; ci < crows.length; ci++) {
    var c = crows[ci];
    var d = document.createElement("div");
    d.className = "crow " + c.cls + (c.region === activeRegion ? " crow-active" : "");
    var gutter = "";
    if (c.showBtns) {
      gutter = '<button class="acc-btn acc-left" data-action="left" data-region="' + c.region + '" title="保留左侧 (1)">&#171;</button>' +
               '<button class="acc-btn acc-right" data-action="right" data-region="' + c.region + '" title="拉入右侧 (2)">&#187;</button>';
    }
    var key2 = c.region + ":" + c.idx;
    var edited = centerEdits[key2] !== undefined;
    d.innerHTML = '<div class="ln">' + gutter + '</div>' +
      (edited
        ? '<textarea data-region="' + c.region + '" data-idx="' + c.idx + '" rows="1">' + esc(c.text) + '</textarea>'
        : '<div class="code" data-region="' + c.region + '" data-idx="' + c.idx + '">' + esc(c.text) + '</div>');
    centerBody.appendChild(d);
  }

  // 行号近似（中间栏以左侧行号为主）
  var pending = regions.filter(function(r) { return r.state === "pending"; }).length;
  document.getElementById("navInfo").textContent = pending + "/" + regions.length;
  document.getElementById("status").textContent =
    currentItem.index + "/" + currentItem.total + " · " + currentItem.deviceId +
    " · 已处理 " + (regions.length - pending) + "/" + regions.length + " 处更改";
  renderStrip();
}

function renderStrip() {
  var strip = document.getElementById("strip");
  var total = Math.max(1, lineCount);
  strip.querySelectorAll(".strip-seg").forEach(function(el) { el.remove(); });
  regions.forEach(function(r, idx) {
    var seg = document.createElement("div");
    seg.className = "strip-seg" + (r.state === "pending" ? " pending" : "");
    seg.style.top = ((idx + 0.5) / Math.max(regions.length, 1)) * 88 + 4 + "%";
    seg.title = "更改 " + (idx + 1) + (r.state === "pending" ? "（待处理）" : "（已处理）");
    seg.dataset.region = idx;
    strip.insertBefore(seg, document.getElementById("stripViewport"));
  });
  updateViewport();
}

function updateViewport() {
  var body = document.getElementById("centerBody");
  var vp = document.getElementById("stripViewport");
  var ratio = body.clientHeight / Math.max(body.scrollHeight, body.clientHeight);
  vp.style.height = Math.max(ratio * 100, 4) + "%";
  vp.style.top = (body.scrollTop / Math.max(body.scrollHeight, body.clientHeight)) * (100 - Math.max(ratio * 100, 4)) + "%";
}

document.getElementById("centerBody").addEventListener("scroll", function() {
  updateViewport();
  var top = this.scrollTop;
  document.getElementById("leftBody").scrollTop = top;
  document.getElementById("rightBody").scrollTop = top;
});

document.getElementById("strip").addEventListener("click", function(e) {
  var seg = e.target.closest(".strip-seg");
  if (!seg) return;
  activeRegion = parseInt(seg.dataset.region, 10);
  jumpToRegion(activeRegion);
});

function jumpToRegion(regionIdx) {
  render();
  setTimeout(function() {
    var el = document.querySelector('.code[data-region="' + regionIdx + '"][data-idx="0"]');
    if (el) { el.scrollIntoView({ block: "center", behavior: "smooth" }); }
  }, 0);
}

function jumpRegion(dir) {
  if (regions.length === 0) { showToast("没有更改区域"); return; }
  var next = activeRegion < 0 ? (dir > 0 ? 0 : regions.length - 1) : (activeRegion + dir + regions.length) % regions.length;
  activeRegion = next;
  jumpToRegion(next);
}

document.addEventListener("click", function(e) {
  var btn = e.target.closest("[data-action]");
  if (!btn) return;
  var regionIdx = parseInt(btn.dataset.region, 10);
  var r = regions[regionIdx];
  if (!r) return;
  var side = btn.dataset.action;
  if (side === "left") r.state = "left";
  if (side === "right") r.state = "right";
  activeRegion = regionIdx;
  render();
  jumpToRegion(regionIdx);
});

// 点击中间栏文本 → 升级为可编辑 textarea（保留光标所在行内容）
document.getElementById("centerBody").addEventListener("click", function(e) {
  var code = e.target.closest(".code");
  if (!code || code.dataset.region === undefined || code.dataset.idx === undefined) return;
  var regionIdx = code.dataset.region, idx = code.dataset.idx;
  var key = regionIdx + ":" + idx;
  var current = code.textContent;
  var ta = document.createElement("textarea");
  ta.setAttribute("data-region", regionIdx);
  ta.setAttribute("data-idx", idx);
  ta.rows = 1;
  ta.value = current;
  code.replaceWith(ta);
  ta.focus();
  ta.setSelectionRange(ta.value.length, ta.value.length);
  ta.addEventListener("input", function() {
    centerEdits[key] = ta.value;
    ta.style.height = "auto";
    ta.style.height = ta.scrollHeight + "px";
  });
  ta.addEventListener("blur", function() {
    centerEdits[key] = ta.value;
  });
});

function buildMergedResult() {
  var parts = [];
  var regionIdx = -1;
  for (var bi = 0; bi < BLOCKS.length; bi++) {
    var b = BLOCKS[bi];
    if (b.type === "equal") {
      regionIdx++;
      for (var li = 0; li < b.lines.length; li++) {
        var key = regionIdx + ":" + li;
        parts.push(centerEdits[key] !== undefined ? centerEdits[key] : b.lines[li]);
      }
    } else {
      regionIdx++;
      var r = regions[regionIdx];
      var addedHere = b.type === "added" ? b : (BLOCKS[bi + 1] && BLOCKS[bi + 1].type === "added" ? BLOCKS[bi + 1] : null);
      var removedHere = b.type === "removed" ? b : null;
      var src = r.state === "right" ? (r.confLines.length ? r.confLines : (addedHere ? addedHere.lines : [])) : r.origLines;
      var n = Math.max(src.length, removedHere ? removedHere.lines.length : 0, addedHere ? addedHere.lines.length : 0);
      for (var k = 0; k < n; k++) {
        var key2 = regionIdx + ":" + k;
        if (centerEdits[key2] !== undefined) { parts.push(centerEdits[key2]); continue; }
        var lTxt = removedHere ? (removedHere.lines[k] || "") : "";
        var rTxt = addedHere ? (addedHere.lines[k] || "") : (r.confLines[k] || "");
        parts.push(r.state === "right" ? rTxt : lTxt);
      }
      if (addedHere && b.type === "removed") bi++;
    }
  }
  return parts.join("\n");
}

function postAndApply(url, body) {
  fetch(url, { method: "POST", headers: {"Content-Type": "text/plain"}, body: body || "" })
    .then(function(r) { return r.json(); })
    .then(function(state) {
      if (state.action && state.action.success === false) showToast("Action failed: " + state.action.error);
      applyState(state);
    })
    .catch(function(e) { alert("Request failed: " + e.message); });
}

document.getElementById("btnApply").addEventListener("click", function() { postAndApply("/save", buildMergedResult()); });
document.getElementById("btnAbort").addEventListener("click", function() { postAndApply("/skip"); });
document.getElementById("btnSkip").addEventListener("click", function() { postAndApply("/skip"); });
document.getElementById("btnQuit").addEventListener("click", function() { postAndApply("/quit"); });
document.getElementById("btnNext").addEventListener("click", function() { jumpRegion(1); });
document.getElementById("btnPrev").addEventListener("click", function() { jumpRegion(-1); });

document.addEventListener("keydown", function(e) {
  if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
    e.preventDefault();
    postAndApply("/save", buildMergedResult());
  } else if (e.key === "F7" && e.shiftKey) {
    e.preventDefault();
    jumpRegion(-1);
  } else if (e.key === "F7") {
    e.preventDefault();
    jumpRegion(1);
  } else if (e.altKey && e.key === "ArrowLeft") {
    e.preventDefault();
    var r1 = regions[activeRegion];
    if (r1) { r1.state = "left"; render(); }
  } else if (e.altKey && e.key === "ArrowRight") {
    e.preventDefault();
    var r2 = regions[activeRegion];
    if (r2) { r2.state = "right"; render(); }
  }
});
</script>
</body>
</html>
